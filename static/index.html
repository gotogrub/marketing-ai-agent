<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketing AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white">
      <div class="container-fluid">
        <span class="navbar-brand fw-semibold">Marketing AI Agent</span>
        <div class="d-flex align-items-center gap-2 small text-secondary">
          <span id="healthProvider" class="badge text-bg-light border">provider</span>
          <span id="healthToken" class="badge text-bg-light border">HF</span>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-3">
      <div class="row g-3">
        <section class="col-12 col-xl-4">
          <div class="panel">
            <div class="panel-header">
              <div>
                <div class="label">Question</div>
                <h1 class="h5 mb-0">Console</h1>
              </div>
              <button id="clearBtn" class="btn btn-outline-secondary btn-sm" type="button" title="Clear">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>

            <textarea id="questionInput" class="form-control question-box" rows="7"></textarea>

            <div class="row g-2 mt-2">
              <div class="col-7">
                <label for="providerSelect" class="form-label small text-secondary mb-1">Provider</label>
                <select id="providerSelect" class="form-select">
                  <option value="huggingface">huggingface</option>
                  <option value="sber">sber</option>
                </select>
              </div>
              <div class="col-5 d-flex align-items-end">
                <button id="sendBtn" class="btn btn-dark w-100" type="button">
                  <i class="bi bi-send"></i>
                  Ask
                </button>
              </div>
            </div>

            <div class="mt-3">
              <div class="label mb-2">Examples</div>
              <div id="examples" class="d-grid gap-2"></div>
            </div>
          </div>
        </section>

        <section class="col-12 col-xl-8">
          <div class="panel output-panel">
            <div class="panel-header">
              <div class="d-flex align-items-center gap-2">
                <span id="intentBadge" class="badge rounded-pill text-bg-secondary">idle</span>
                <span id="providerBadge" class="badge rounded-pill text-bg-light border">provider</span>
              </div>
              <div id="latency" class="small text-secondary"></div>
            </div>
          </div>

          <div class="row g-3 mt-0">
            <div class="col-12 col-lg-6">
              <div class="panel secondary-panel">
                <div class="panel-header">
                  <h2 class="h6 mb-0">Sources</h2>
                  <span id="sourceCount" class="badge text-bg-light border">0</span>
                </div>
                <div id="sources" class="source-list"></div>
              </div>
            </div>
            <div class="col-12 col-lg-6">
              <div class="panel secondary-panel">
                <div class="panel-header">
                  <h2 class="h6 mb-0">Debug</h2>
                  <button id="copyDebugBtn" class="btn btn-outline-secondary btn-sm" type="button" title="Copy debug JSON">
                    <i class="bi bi-clipboard"></i>
                  </button>
                </div>
                <pre id="debug" class="debug mb-0">{}</pre>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
